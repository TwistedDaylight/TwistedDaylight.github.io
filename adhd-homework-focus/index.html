<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Focus Friend" />
  <meta name="theme-color" content="#FFB347" />
  <title>Focus Friend</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ── VARIABLES ─────────────────────────────────────── */
    :root {
      --sun:       #FFD32A;
      --tangerine: #FF8C00;
      --coral:     #FF6B6B;
      --mint:      #4CD964;
      --sky:       #4FC3F7;
      --lavender:  #B39DDB;
      --cream:     #FFF9EC;
      --warm-white:#FFFDF7;
      --dark-text: #2D1B00;
      --muted:     #A08060;
      --shadow:    rgba(0,0,0,0.12);
      --tap-min:   56px;
      --radius-card: 28px;
      --radius-btn:  20px;
    }

    /* ── RESET ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--dark-text);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    button {
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      border: none;
      transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s;
    }
    button:active { transform: scale(0.94); }
    input { font-family: 'Nunito', sans-serif; }

    /* ── SCREENS ───────────────────────────────────────── */
    .screen {
      display: none;
      min-height: 100dvh;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 36px;
      gap: 16px;
      overflow-x: hidden;
    }
    .screen.active { display: flex; }

    /* ── HOME SCREEN ───────────────────────────────────── */
    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 4px;
    }
    .app-emoji { font-size: 2.2rem; }
    .app-title {
      font-family: 'Fredoka One', sans-serif;
      font-size: clamp(1.6rem, 6vw, 2rem);
      color: var(--tangerine);
      flex: 1;
    }
    .streak-badge {
      background: linear-gradient(135deg, var(--tangerine), var(--sun));
      border-radius: 20px;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 14px rgba(255,140,0,0.3);
      flex-shrink: 0;
    }
    .streak-fire { font-size: 1.1rem; }
    .streak-num {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1.2rem;
      color: white;
    }
    .streak-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
    }

    .stars-display {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 4px 8px;
      background: white;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .star { font-size: 1.4rem; }
    .star-overflow {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1rem;
      color: var(--tangerine);
    }
    .stars-empty {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 700;
    }

    /* Checklist card */
    .checklist-card {
      background: white;
      border-radius: var(--radius-card);
      padding: 20px 18px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 18px var(--shadow);
    }
    .checklist-title {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1.2rem;
      color: var(--dark-text);
      margin-bottom: 14px;
    }
    .checklist-items { display: flex; flex-direction: column; gap: 8px; }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--cream);
      border: 2.5px solid transparent;
      min-height: var(--tap-min);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, opacity 0.15s;
      position: relative;
    }
    .checklist-item:not(.done):hover { border-color: var(--sun); }
    .checklist-item.done {
      border-color: var(--mint);
      background: #F0FFF4;
      opacity: 0.72;
      cursor: default;
    }
    .checklist-checkbox {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 3px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      transition: all 0.2s;
      background: white;
    }
    .checklist-item.done .checklist-checkbox {
      background: var(--mint);
      border-color: var(--mint);
      color: white;
    }
    .checklist-text {
      flex: 1;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .delete-item-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: #FFE0E0;
      color: var(--coral);
      font-size: 0.9rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .delete-item-btn:active { transform: scale(0.88); }

    .add-item-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .add-item-input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid #E8E0D0;
      background: var(--cream);
      font-size: 1rem;
      font-weight: 700;
      color: var(--dark-text);
      outline: none;
      min-height: var(--tap-min);
    }
    .add-item-input:focus { border-color: var(--tangerine); }
    .add-item-input::placeholder { color: #C0B090; }
    .add-item-btn {
      width: var(--tap-min);
      height: var(--tap-min);
      border-radius: 14px;
      background: var(--tangerine);
      color: white;
      font-size: 1.6rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(255,140,0,0.3);
    }

    /* Timer picker */
    .timer-picker {
      width: 100%;
      max-width: 420px;
    }
    .picker-label {
      font-weight: 900;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 10px;
      text-align: center;
    }
    .picker-options {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .timer-option-btn {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1rem;
      padding: 12px 18px;
      border-radius: 16px;
      border: 3px solid #E0D8CC;
      background: white;
      color: var(--dark-text);
      min-height: 52px;
      flex: 1;
      max-width: 120px;
    }
    .timer-option-btn.active {
      border-color: var(--tangerine);
      background: #FFF3E0;
      color: var(--tangerine);
      transform: scale(1.05);
    }

    /* Big start button */
    .big-start-btn {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1.4rem;
      background: linear-gradient(135deg, var(--tangerine), #FF6000);
      color: white;
      border-radius: var(--radius-btn);
      padding: 18px 32px;
      min-height: 68px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 6px 20px rgba(255,140,0,0.4);
    }
    .big-start-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .sound-toggle {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      background: none;
      padding: 8px 16px;
      border-radius: 12px;
      border: 2px solid #E0D8CC;
    }

    /* ── FOCUS SCREEN ──────────────────────────────────── */
    #screen-focus {
      background: var(--cream);
      justify-content: space-between;
      padding-top: 16px;
    }
    .focus-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }
    .pause-btn {
      font-size: 1.8rem;
      background: white;
      width: 54px; height: 54px;
      border-radius: 50%;
      box-shadow: 0 3px 12px var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .focus-stars {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1.3rem;
      background: white;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 3px 12px var(--shadow);
      color: var(--dark-text);
    }

    /* SVG timer ring */
    .timer-ring-wrap {
      position: relative;
      width: 260px; height: 260px;
      flex-shrink: 0;
    }
    .timer-svg { display: block; }
    .timer-bg-ring {
      fill: none;
      stroke: #EDE0CC;
      stroke-width: 18;
    }
    .timer-fill-ring {
      fill: none;
      stroke: var(--mint);
      stroke-width: 18;
      stroke-linecap: round;
      transform-origin: 130px 130px;
      transform: rotate(-90deg);
      transition: stroke-dashoffset 0.85s linear, stroke 0.5s ease;
    }
    .timer-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .timer-num {
      font-family: 'Fredoka One', sans-serif;
      font-size: 4rem;
      color: var(--dark-text);
      line-height: 1;
    }
    .timer-lbl {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    .current-task {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1.15rem;
      color: var(--dark-text);
      text-align: center;
      background: white;
      padding: 12px 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .encourage-row {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1.3rem;
      color: var(--tangerine);
      text-align: center;
      min-height: 2rem;
      transition: opacity 0.4s;
    }
    .home-btn {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
      background: none;
      padding: 10px 20px;
      border-radius: 12px;
      border: 2px solid #E0D8CC;
    }

    /* ── BREAK SCREEN ──────────────────────────────────── */
    #screen-break {
      background: linear-gradient(160deg, #87CEEB 0%, #4FC3F7 100%);
      justify-content: center;
      padding: 24px 16px;
    }
    .break-card {
      background: white;
      border-radius: 32px;
      padding: 32px 24px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 50px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .break-header {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1.4rem;
      color: var(--sky);
    }
    .break-activity-emoji {
      font-size: 90px;
      line-height: 1;
      animation: bounce 1.1s infinite;
    }
    .break-activity-name {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1.6rem;
      color: var(--dark-text);
    }
    .break-activity-desc {
      font-size: 1rem;
      font-weight: 700;
      color: var(--muted);
      line-height: 1.4;
    }

    .break-ring-wrap {
      position: relative;
      width: 130px; height: 130px;
      flex-shrink: 0;
    }
    .break-bg-ring {
      fill: none;
      stroke: #E8F8FF;
      stroke-width: 14;
    }
    .break-fill-ring {
      fill: none;
      stroke: var(--sky);
      stroke-width: 14;
      stroke-linecap: round;
      transform-origin: 65px 65px;
      transform: rotate(-90deg);
      transition: stroke-dashoffset 0.85s linear;
    }
    .break-timer-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .break-timer-num {
      font-family: 'Fredoka One', sans-serif;
      font-size: 2rem;
      color: var(--sky);
    }

    .skip-break-btn {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1.2rem;
      background: linear-gradient(135deg, var(--mint), #28C048);
      color: white;
      border-radius: 18px;
      padding: 16px 28px;
      min-height: 60px;
      width: 100%;
      box-shadow: 0 4px 14px rgba(76,217,100,0.35);
    }

    /* ── CELEBRATE SCREEN ──────────────────────────────── */
    #screen-celebrate {
      background: linear-gradient(160deg, #D4B8FF 0%, var(--sun) 100%);
      justify-content: center;
      padding: 24px 16px;
    }
    .celebrate-card {
      background: white;
      border-radius: 32px;
      padding: 36px 24px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 50px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .celebrate-emoji {
      font-size: 96px;
      line-height: 1;
      display: block;
      animation: bounceScale 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .celebrate-title {
      font-family: 'Fredoka One', sans-serif;
      font-size: 2rem;
      color: var(--tangerine);
    }
    .celebrate-subtitle {
      font-size: 1rem;
      font-weight: 700;
      color: var(--muted);
      line-height: 1.4;
    }
    .celebrate-big-stars {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 2rem;
      min-height: 2.5rem;
    }
    .celebrate-star {
      display: inline-block;
      animation: starPop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .total-stars-row {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
    }
    .done-today-btn {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1.1rem;
      background: none;
      border: 3px solid #E0D8CC;
      color: var(--muted);
      border-radius: 16px;
      padding: 14px 24px;
      min-height: 56px;
      width: 100%;
    }

    /* ── ANIMATIONS ────────────────────────────────────── */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }
    @keyframes bounceScale {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @keyframes starPop {
      0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
      60%  { transform: scale(1.4) rotate(10deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25%       { transform: rotate(-12deg); }
      75%       { transform: rotate(12deg); }
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-30px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(110vh)  rotate(720deg); opacity: 0; }
    }
    .confetti-piece {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: confettiFall linear forwards;
    }
  </style>
</head>
<body>

  <!-- ══ HOME SCREEN ══════════════════════════════════════ -->
  <div id="screen-home" class="screen active">

    <div class="app-header">
      <div class="app-emoji">🌟</div>
      <h1 class="app-title">Focus Friend</h1>
      <div class="streak-badge">
        <span class="streak-fire">🔥</span>
        <span class="streak-num" id="streak-num">0</span>
        <span class="streak-label">days!</span>
      </div>
    </div>

    <div class="stars-display" id="stars-display">
      <span class="stars-empty">Earn stars by doing homework! ⭐</span>
    </div>

    <div class="checklist-card">
      <div class="checklist-title">📚 Today's Homework</div>
      <div class="checklist-items" id="checklist-items"></div>
      <div class="add-item-row">
        <input
          type="text"
          id="new-item-input"
          class="add-item-input"
          placeholder="Add homework..."
          maxlength="50"
        />
        <button class="add-item-btn" onclick="addChecklistItem()">＋</button>
      </div>
    </div>

    <div class="timer-picker">
      <div class="picker-label">⏱️ How long to focus?</div>
      <div class="picker-options" id="timer-options"></div>
    </div>

    <button class="big-start-btn" id="start-btn" onclick="beginFocus()">
      Let's Focus! 🚀
    </button>

    <button class="sound-toggle" id="sound-toggle" onclick="toggleSound()">
      🔇 Focus Sounds: OFF
    </button>

  </div><!-- /screen-home -->

  <!-- ══ FOCUS SCREEN ═════════════════════════════════════ -->
  <div id="screen-focus" class="screen">

    <div class="focus-header">
      <button class="pause-btn" id="pause-btn" onclick="togglePause()">⏸️</button>
      <div class="focus-stars" id="focus-stars">⭐ 0</div>
    </div>

    <div class="timer-ring-wrap">
      <svg class="timer-svg" width="260" height="260" viewBox="0 0 260 260" aria-hidden="true">
        <circle class="timer-bg-ring"   cx="130" cy="130" r="115" />
        <circle class="timer-fill-ring" cx="130" cy="130" r="115"
                id="timer-fill-ring"
                stroke-dasharray="722.57"
                stroke-dashoffset="0" />
      </svg>
      <div class="timer-center">
        <div class="timer-num" id="timer-num">5:00</div>
        <div class="timer-lbl" id="timer-lbl">keep going! 💪</div>
      </div>
    </div>

    <div class="current-task" id="current-task">Working hard! 🌟</div>
    <div class="encourage-row" id="encourage-row">You can do it! 🌟</div>

    <button class="home-btn" onclick="endSession()">🏠 Done for now</button>

  </div><!-- /screen-focus -->

  <!-- ══ BREAK SCREEN ══════════════════════════════════════ -->
  <div id="screen-break" class="screen">

    <div class="break-card">
      <div class="break-header">⏸️ Movement Break!</div>
      <div class="break-activity-emoji" id="break-emoji">🦘</div>
      <div class="break-activity-name" id="break-activity">Jump Around!</div>
      <div class="break-activity-desc" id="break-desc">Do 10 big jumps!</div>

      <div class="break-ring-wrap">
        <svg class="timer-svg" width="130" height="130" viewBox="0 0 130 130" aria-hidden="true">
          <circle class="break-bg-ring"   cx="65" cy="65" r="52" />
          <circle class="break-fill-ring" cx="65" cy="65" r="52"
                  id="break-fill-ring"
                  stroke-dasharray="326.73"
                  stroke-dashoffset="0" />
        </svg>
        <div class="break-timer-center">
          <div class="break-timer-num" id="break-timer-num">60</div>
        </div>
      </div>

      <button class="skip-break-btn" onclick="endBreak()">Ready! Let's go! 🚀</button>
    </div>

  </div><!-- /screen-break -->

  <!-- ══ CELEBRATE SCREEN ══════════════════════════════════ -->
  <div id="screen-celebrate" class="screen">

    <div class="celebrate-card">
      <div class="celebrate-emoji" id="celebrate-emoji">🎉</div>
      <div class="celebrate-title" id="celebrate-title">Amazing Job!</div>
      <div class="celebrate-subtitle" id="celebrate-subtitle">You finished your homework!</div>
      <div class="celebrate-big-stars" id="celebrate-big-stars"></div>
      <div class="total-stars-row" id="total-stars-row">Total stars today: ⭐0</div>
      <button class="big-start-btn" onclick="showScreen('home')" style="margin-top:6px;">
        More Homework! 📚
      </button>
      <button class="done-today-btn" onclick="finishForToday()">
        All Done for Today! 🎉
      </button>
    </div>

  </div><!-- /screen-celebrate -->

<script>
/* ═══════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════ */
const TIMER_CIRC = 722.57;  // 2 * π * 115
const BREAK_CIRC = 326.73;  // 2 * π * 52

const TIMER_OPTIONS = [
  { label: '5 min ⚡', value: 5 * 60 },
  { label: '7 min 🌟', value: 7 * 60 },
  { label: '10 min 🔥', value: 10 * 60 },
];

const BREAKS = [
  { emoji: '🦘', name: 'Jumping Jacks!',  desc: 'Do 10 jumping jacks — arms and legs wide!' },
  { emoji: '💃', name: 'Dance Freeze!',   desc: 'Dance to 3 beats, then FREEZE like a statue!' },
  { emoji: '🐻', name: 'Bear Walk!',      desc: 'Walk on hands and feet to the wall and back!' },
  { emoji: '⭐', name: 'Star Jumps!',     desc: 'Jump up making a big star shape — do 10!' },
  { emoji: '🏋️', name: 'Wall Push-Ups!', desc: 'Do 8 push-ups against the wall!' },
  { emoji: '🐸', name: 'Frog Jumps!',    desc: 'Squat down low and jump up HIGH — 8 times!' },
  { emoji: '🧘', name: 'Big Breaths!',   desc: '5 huge breaths — in through nose, out through mouth!' },
  { emoji: '🌪️', name: 'Spin Around!',   desc: 'Spin 5 times one way, then 5 the other way!' },
];

const ENCOURAGEMENTS = [
  'You can do it! 🌟',
  'Super focused! 💪',
  'Brain power! 🧠',
  'Almost there! ⭐',
  'You\'re amazing! 🎉',
  'Keep going! 🚀',
  'So smart! 📚',
  'You\'ve got this! 🦁',
  'Incredible! ✨',
  'Star student! 🌠',
];

const state = {
  timerDuration:    5 * 60,
  breakDuration:    60,
  timerRemaining:   0,
  breakRemaining:   0,
  timerInterval:    null,
  breakInterval:    null,
  encourageInterval: null,
  sessionPaused:    false,
  currentBreakIndex: 0,
  encourageIndex:   0,
  starsToday:       0,
  lastStarDate:     null,
  items:            [],
  soundEnabled:     false,
  audioCtx:         null,
  gainNode:         null,
  noiseSource:      null,
  streak:           0,
  lastActiveDate:   null,
};

/* ═══════════════════════════════════════════════════════
   PERSISTENCE
═══════════════════════════════════════════════════════ */
function today() {
  return new Date().toISOString().slice(0, 10);
}
function yesterday() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

function loadData() {
  try {
    const raw = localStorage.getItem('ff-data');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { streak: 0, lastActiveDate: null, starsToday: 0, lastStarDate: null, items: [] };
}

function saveData() {
  try {
    localStorage.setItem('ff-data', JSON.stringify({
      streak:         state.streak,
      lastActiveDate: state.lastActiveDate,
      starsToday:     state.starsToday,
      lastStarDate:   state.lastStarDate,
      items:          state.items,
    }));
  } catch(e) {}
}

function initFromStorage() {
  const saved = loadData();
  const t = today();

  // Restore items
  state.items = saved.items || [];

  // Restore daily stars (reset if new day)
  if (saved.lastStarDate === t) {
    state.starsToday  = saved.starsToday || 0;
    state.lastStarDate = t;
  } else {
    state.starsToday  = 0;
    state.lastStarDate = null;
  }

  // Restore streak
  state.streak = saved.streak || 0;
  state.lastActiveDate = saved.lastActiveDate || null;
  // If last active was before yesterday, streak is broken (but don't reset here — only on new completion)
}

/* ═══════════════════════════════════════════════════════
   SCREEN ROUTER
═══════════════════════════════════════════════════════ */
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (name === 'home')      onEnterHome();
  if (name === 'focus')     startFocusTimer();
  if (name === 'break')     startBreakTimer();
  if (name === 'celebrate') onEnterCelebrate();
}

/* ═══════════════════════════════════════════════════════
   HOME SCREEN
═══════════════════════════════════════════════════════ */
function onEnterHome() {
  renderStreakBadge();
  renderStarsDisplay();
  renderChecklist();
  buildTimerPicker();
  updateStartButton();
  // Reset encouragement index so it starts fresh
  state.encourageIndex = 0;
}

function renderStreakBadge() {
  document.getElementById('streak-num').textContent = state.streak;
}

function renderStarsDisplay() {
  const display = document.getElementById('stars-display');
  if (state.starsToday === 0) {
    display.innerHTML = '<span class="stars-empty">Earn stars by doing homework! ⭐</span>';
    return;
  }
  const shown = Math.min(state.starsToday, 10);
  let html = '';
  for (let i = 0; i < shown; i++) html += '<span class="star">⭐</span>';
  const overflow = state.starsToday - shown;
  if (overflow > 0) html += `<span class="star-overflow">+${overflow} more!</span>`;
  display.innerHTML = html;
  // Also update focus screen counter
  document.getElementById('focus-stars').textContent = `⭐ ${state.starsToday}`;
}

function buildTimerPicker() {
  const container = document.getElementById('timer-options');
  container.innerHTML = '';
  TIMER_OPTIONS.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'timer-option-btn' + (state.timerDuration === opt.value ? ' active' : '');
    btn.textContent = opt.label;
    btn.onclick = () => {
      state.timerDuration = opt.value;
      buildTimerPicker();
    };
    container.appendChild(btn);
  });
}

function updateStartButton() {
  const btn = document.getElementById('start-btn');
  // Always allow starting (free focus mode if no items)
  btn.disabled = false;
}

/* ═══════════════════════════════════════════════════════
   CHECKLIST
═══════════════════════════════════════════════════════ */
function addChecklistItem() {
  const input = document.getElementById('new-item-input');
  const text  = input.value.trim();
  if (!text) return;

  state.items.push({ id: 'item-' + Date.now(), text, done: false });
  input.value = '';
  renderChecklist();
  saveData();
}

function toggleItem(id) {
  const item = state.items.find(i => i.id === id);
  if (!item || item.done) return;
  item.done = true;
  saveData();
  renderChecklist();
  showCelebration(item.text);
  recordActiveToday();
}

function deleteItem(id) {
  state.items = state.items.filter(i => i.id !== id);
  renderChecklist();
  saveData();
}

function renderChecklist() {
  const container = document.getElementById('checklist-items');
  container.innerHTML = '';

  if (state.items.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#C0B090;font-size:0.9rem;padding:8px 0;">Add your homework above!</div>';
    return;
  }

  state.items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'checklist-item' + (item.done ? ' done' : '');

    const check = document.createElement('div');
    check.className = 'checklist-checkbox';
    check.textContent = item.done ? '✓' : '';

    const label = document.createElement('span');
    label.className = 'checklist-text';
    label.textContent = item.text;

    div.appendChild(check);
    div.appendChild(label);

    if (!item.done) {
      const del = document.createElement('button');
      del.className = 'delete-item-btn';
      del.textContent = '✕';
      del.onclick = e => { e.stopPropagation(); deleteItem(item.id); };
      div.appendChild(del);
      div.onclick = () => toggleItem(item.id);
    }

    container.appendChild(div);
  });
}

/* ═══════════════════════════════════════════════════════
   FOCUS TIMER
═══════════════════════════════════════════════════════ */
function beginFocus() {
  // Pick the first unchecked item as context, or generic label
  const pending = state.items.find(i => !i.done);
  state._focusTaskLabel = pending ? pending.text : null;
  showScreen('focus');
}

function startFocusTimer() {
  const ring = document.getElementById('timer-fill-ring');
  ring.style.strokeDasharray  = TIMER_CIRC;
  ring.style.strokeDashoffset = '0';
  ring.style.stroke = '#4CD964';

  state.timerRemaining = state.timerDuration;
  state.sessionPaused  = false;
  document.getElementById('pause-btn').textContent = '⏸️';
  document.getElementById('focus-stars').textContent = `⭐ ${state.starsToday}`;

  // Show current task context
  const taskEl = document.getElementById('current-task');
  taskEl.textContent = state._focusTaskLabel
    ? `Working on: ${state._focusTaskLabel} 📝`
    : 'Working hard! 🌟';

  updateTimerDisplay();

  if (state.soundEnabled) {
    playChime('start');
    startAmbientSound();
  }

  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    if (state.sessionPaused) return;
    state.timerRemaining--;
    updateTimerDisplay();
    updateTimerColor();

    if (state.timerRemaining <= 0) {
      clearInterval(state.timerInterval);
      clearInterval(state.encourageInterval);
      awardStar(1);
      if (state.soundEnabled) playChime('complete');
      stopAmbientSound();
      showScreen('break');
    }
  }, 1000);

  // Encouragement rotation
  state.encourageIndex = 0;
  document.getElementById('encourage-row').textContent = ENCOURAGEMENTS[0];
  clearInterval(state.encourageInterval);
  state.encourageInterval = setInterval(() => {
    if (state.sessionPaused) return;
    state.encourageIndex = (state.encourageIndex + 1) % ENCOURAGEMENTS.length;
    const el = document.getElementById('encourage-row');
    el.style.opacity = '0';
    setTimeout(() => {
      el.textContent = ENCOURAGEMENTS[state.encourageIndex];
      el.style.opacity = '1';
    }, 400);
  }, 30000);
}

function updateTimerDisplay() {
  const mins = Math.floor(state.timerRemaining / 60);
  const secs = state.timerRemaining % 60;
  document.getElementById('timer-num').textContent =
    `${mins}:${secs.toString().padStart(2, '0')}`;

  const pct  = state.timerRemaining / state.timerDuration;
  const ring = document.getElementById('timer-fill-ring');
  ring.style.strokeDashoffset = TIMER_CIRC * (1 - pct);

  // Update encouragement label near end
  const lbl = document.getElementById('timer-lbl');
  if (pct <= 0.25) lbl.textContent = 'almost done! 🔥';
  else if (pct <= 0.5) lbl.textContent = 'halfway there! 💪';
  else lbl.textContent = 'keep going! 💪';
}

function updateTimerColor() {
  const pct  = state.timerRemaining / state.timerDuration;
  const ring = document.getElementById('timer-fill-ring');
  if (pct > 0.5)       ring.style.stroke = '#4CD964';  // green
  else if (pct > 0.25) ring.style.stroke = '#FFD32A';  // yellow
  else                 ring.style.stroke = '#FF6B6B';  // coral
}

function togglePause() {
  state.sessionPaused = !state.sessionPaused;
  document.getElementById('pause-btn').textContent = state.sessionPaused ? '▶️' : '⏸️';
  if (state.sessionPaused) stopAmbientSound();
  else if (state.soundEnabled) startAmbientSound();
}

function endSession() {
  clearInterval(state.timerInterval);
  clearInterval(state.encourageInterval);
  stopAmbientSound();
  showScreen('home');
}

/* ═══════════════════════════════════════════════════════
   BREAK TIMER
═══════════════════════════════════════════════════════ */
function startBreakTimer() {
  const b    = BREAKS[state.currentBreakIndex % BREAKS.length];
  state.currentBreakIndex++;

  document.getElementById('break-emoji').textContent    = b.emoji;
  document.getElementById('break-activity').textContent = b.name;
  document.getElementById('break-desc').textContent     = b.desc;

  state.breakRemaining = state.breakDuration;

  const ring = document.getElementById('break-fill-ring');
  ring.style.strokeDasharray  = BREAK_CIRC;
  ring.style.strokeDashoffset = '0';

  document.getElementById('break-timer-num').textContent = state.breakRemaining;

  clearInterval(state.breakInterval);
  state.breakInterval = setInterval(() => {
    state.breakRemaining--;
    const pct = state.breakRemaining / state.breakDuration;
    ring.style.strokeDashoffset = BREAK_CIRC * (1 - pct);
    document.getElementById('break-timer-num').textContent = state.breakRemaining;

    if (state.breakRemaining <= 0) {
      clearInterval(state.breakInterval);
      endBreak();
    }
  }, 1000);
}

function endBreak() {
  clearInterval(state.breakInterval);
  if (state.soundEnabled) playChime('start');
  showScreen('focus');
}

/* ═══════════════════════════════════════════════════════
   CELEBRATION
═══════════════════════════════════════════════════════ */
function showCelebration(taskName) {
  // Stop any running focus timer
  clearInterval(state.timerInterval);
  clearInterval(state.encourageInterval);
  stopAmbientSound();

  // Award 3 stars for completing a task
  awardStar(3, /* silent = */ true);

  state._celebrateTask = taskName;
  showScreen('celebrate');
}

function onEnterCelebrate() {
  const taskName = state._celebrateTask || 'your homework';

  // Pick a celebration emoji based on star count (milestone rewards)
  const emojis = ['🎉','⭐','🏆','🌈','🦄','🎊','🚀','🌟'];
  const emoji   = emojis[Math.floor(Math.random() * emojis.length)];

  document.getElementById('celebrate-emoji').textContent    = emoji;
  document.getElementById('celebrate-title').textContent    = 'Amazing Job!';
  document.getElementById('celebrate-subtitle').textContent = `You finished: ${taskName}!`;

  // Animate big stars
  const starContainer = document.getElementById('celebrate-big-stars');
  starContainer.innerHTML = '';
  const count = Math.min(state.starsToday, 8);
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.className = 'celebrate-star';
    s.textContent = '⭐';
    s.style.animationDelay = `${i * 0.12}s`;
    starContainer.appendChild(s);
  }

  document.getElementById('total-stars-row').textContent =
    `Total stars today: ⭐ ${state.starsToday}`;

  launchFullConfetti();
  if (state.soundEnabled) playCelebrationSound();
}

function finishForToday() {
  recordActiveToday();
  showScreen('home');
}

/* ═══════════════════════════════════════════════════════
   STARS & STREAK
═══════════════════════════════════════════════════════ */
function awardStar(count, silent) {
  state.starsToday  += count;
  state.lastStarDate = today();
  saveData();
  renderStarsDisplay();
  if (!silent) playStarSparkle();
  else {
    // Small confetti still fires silently
    playStarSparkle();
  }
  // Update focus-screen counter live
  document.getElementById('focus-stars').textContent = `⭐ ${state.starsToday}`;
}

function playStarSparkle() {
  const colors = ['#FFD32A','#FF8C00','#4CD964','#B39DDB','#FF6B6B','#4FC3F7'];
  for (let i = 0; i < 12; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `
      left: ${30 + Math.random() * 40}vw;
      top: -20px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      animation-delay: ${Math.random() * 0.4}s;
      animation-duration: ${1.2 + Math.random() * 0.8}s;
      width: ${5 + Math.random() * 7}px;
      height: ${5 + Math.random() * 7}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '3px'};
    `;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2500);
  }
}

function launchFullConfetti() {
  const colors = ['#FF6B6B','#FFD32A','#4CD964','#4FC3F7','#B39DDB','#FF8C00','white'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `
      left: ${Math.random() * 100}vw;
      top: -20px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      animation-delay: ${Math.random() * 2.2}s;
      animation-duration: ${2.0 + Math.random() * 1.8}s;
      width: ${7 + Math.random() * 13}px;
      height: ${7 + Math.random() * 13}px;
      border-radius: ${Math.random() > 0.4 ? '50%' : '3px'};
    `;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}

function recordActiveToday() {
  const t = today();
  const y = yesterday();

  if (state.lastActiveDate !== t) {
    // New day — update streak
    if (state.lastActiveDate === y) {
      state.streak++;  // consecutive day
    } else if (!state.lastActiveDate) {
      state.streak = 1;  // first ever
    } else {
      state.streak = 1;  // streak broken, restart at 1
    }
    state.lastActiveDate = t;
  }
  // Always refresh streak display even if same day
  renderStreakBadge();
  saveData();
}

/* ═══════════════════════════════════════════════════════
   WEB AUDIO
═══════════════════════════════════════════════════════ */
function getAudioCtx() {
  if (!state.audioCtx) {
    state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
  return state.audioCtx;
}

function playChime(type) {
  try {
    const ctx   = getAudioCtx();
    const freqs = type === 'start'
      ? [523, 659, 784]      // C5-E5-G5 upward arpeggio
      : [784, 1047, 1319];   // G5-C6-E6 triumphant

    freqs.forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;

      const t = ctx.currentTime + i * 0.13;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.28, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
      osc.start(t);
      osc.stop(t + 0.9);
    });
  } catch(e) {}
}

function startAmbientSound() {
  if (!state.soundEnabled) return;
  stopAmbientSound();  // clear any previous
  try {
    const ctx        = getAudioCtx();
    const bufferSize = ctx.sampleRate * 3;
    const buffer     = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data       = buffer.getChannelData(0);

    // Brown noise: integrate white noise
    let lastOut = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      data[i]  = (lastOut + 0.02 * white) / 1.02;
      lastOut  = data[i];
      data[i] *= 3.5;
    }

    state.noiseSource       = ctx.createBufferSource();
    state.noiseSource.buffer = buffer;
    state.noiseSource.loop   = true;

    const filter = ctx.createBiquadFilter();
    filter.type            = 'lowpass';
    filter.frequency.value = 800;

    state.gainNode             = ctx.createGain();
    state.gainNode.gain.value  = 0.14;

    state.noiseSource.connect(filter);
    filter.connect(state.gainNode);
    state.gainNode.connect(ctx.destination);
    state.noiseSource.start();
  } catch(e) {}
}

function stopAmbientSound() {
  if (state.noiseSource) {
    try {
      if (state.gainNode) {
        const ctx = getAudioCtx();
        state.gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
        const src = state.noiseSource;
        setTimeout(() => { try { src.stop(); } catch(e) {} }, 360);
      } else {
        state.noiseSource.stop();
      }
    } catch(e) {}
    state.noiseSource = null;
    state.gainNode    = null;
  }
}

function playCelebrationSound() {
  try {
    const ctx    = getAudioCtx();
    const melody = [
      { freq: 523,  t: 0   },
      { freq: 659,  t: 0.1 },
      { freq: 784,  t: 0.2 },
      { freq: 1047, t: 0.35 },
      { freq: 1319, t: 0.5 },
      { freq: 1568, t: 0.7 },
    ];
    melody.forEach(({ freq, t }) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;

      const start = ctx.currentTime + t;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.32, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.65);
      osc.start(start);
      osc.stop(start + 0.7);
    });
  } catch(e) {}
}

function toggleSound() {
  state.soundEnabled = !state.soundEnabled;
  const btn = document.getElementById('sound-toggle');
  btn.textContent = state.soundEnabled ? '🔊 Focus Sounds: ON' : '🔇 Focus Sounds: OFF';
  if (state.soundEnabled) {
    playChime('start');  // test chime + resumes AudioContext
  } else {
    stopAmbientSound();
  }
}

/* ═══════════════════════════════════════════════════════
   KEYBOARD SUPPORT
═══════════════════════════════════════════════════════ */
document.getElementById('new-item-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addChecklistItem();
});

/* ═══════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════ */
(function init() {
  initFromStorage();
  onEnterHome();
})();
</script>
